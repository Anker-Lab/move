<body>
    <!-- Header -->
    <header>
    <div class="container header-inner">

  <!-- MOBILE HAMBURGER -->
  <div class="hamburger" id="burger">☰</div>

  <!-- LEFT SIDE -->
  <div class="header-left">

    <a href="/en/" class="logo">
      <img
        id="header-logo"
        src="/assets/logo/move/move_w_en.svg"
        alt="Move Logo">
    </a>

    <a data-link="facebook"
       class="social-link"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Facebook">
      <img src="/assets/logo/fb/facebook-app-symbol_white.svg" alt="">
    </a>

    <a data-link="instagram"
       class="social-link"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
      <img src="/assets/logo/insta/Instagram_Glyph_White.svg" alt="">
    </a>

  </div>

  <!-- NAV -->
  <nav>
    <ul>
      <li><a href="/en/program">Program</a></li>
      <li><a href="/en/info">Info</a></li>
      <li><a href="/en/vision">Vision</a></li>
      <li><a href="/en/frivillig">Volunteer</a></li>
    </ul>
  </nav>

  <!-- RIGHT SIDE -->
  <div class="header-right">

    <div class="lang">
      <div class="lang-icon">🌐</div>
      
      <div class="lang-dropdown">
        <a href="#" onclick="switchToDanish()">Dansk</a>
        <a href="#" onclick="switchToEnglish()">English</a>
      </div>
    </div>

    <a class="btn btn-secondary desktop-cta js-tilmeld" data-link="signup">
      Sign up
    </a>

  </div>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu">

  <a class="btn btn-secondary mobile-cta js-tilmeld" data-link="signup">
    Sign up
  </a>

  <a href="/en/program">Program</a>
  <a href="/en/info">Info</a>
  <a href="/en/vision">Vision</a>
  <a href="/en/frivillig">Volunteer</a>

  <div class="mobile-socials">
    <a data-link="facebook"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
      <img src="/assets/logo/fb/facebook-app-symbol.png" alt="">
    </a>

    <a data-link="instagram"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
      <img src="/assets/logo/insta/Instagram_Glyph_Black.svg" alt="">
    </a>
  </div>

</div>
</div>

</header>
</body>
